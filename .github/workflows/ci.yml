name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".env.example"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".env.example"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm typecheck
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Test & Vet (Linux)
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test -race ./... || go test ./...
          go build -o mmonitor .

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Test & Build (Windows)
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go build -ldflags="-s -w -H=windowsgui" -o mmonitor.exe .
